<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器里为照片添加毛玻璃边框和相机参数水印。">
  <meta name="theme-color" content="#f4f3ed">
  <title>玻璃暗房 · Grain & Glass</title>
  <link rel="stylesheet" href="./styles.css?v=3">
  <script defer src="./assets/vendor/exifr.js"></script>
  <script defer src="./app.js?v=3"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-frame" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/><path d="M17 7h.01"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6m-2-1v-5H9"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-5 5 5"/></symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h6m4 0h6M4 17h10m4 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
  </svg>
  <header class="site-header">
    <div class="brand"><span class="brand-icon"><svg><use href="#icon-frame"/></svg></span><span>Grain <i>&amp;</i> Glass</span></div>
    <span class="privacy"><svg><use href="#icon-lock"/></svg> 照片仅在本地处理</span>
  </header>
  <main>
    <section class="intro">
      <div><h1>玻璃暗房<span>.</span></h1><p>裁切、调色，为照片加上毛玻璃边框和相机水印。</p></div>
      <div class="upload-area">
        <button id="upload" class="button primary" type="button"><svg><use href="#icon-upload"/></svg> 选择照片</button>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
        <small>也可拖入 JPG、PNG 或 WebP</small>
      </div>
    </section>
    <div class="workspace">
      <section class="preview" aria-label="照片预览">
        <div class="preview-header">
          <h2><svg><use href="#icon-image"/></svg> 照片预览</h2>
          <button id="compare" class="button compare" type="button" aria-pressed="false" disabled><svg><use href="#icon-eye"/></svg><span>查看原图</span></button>
        </div>
        <div class="stage" id="stage">
          <canvas id="preview" role="img" aria-label="照片处理效果预览" hidden></canvas>
          <p id="stage-message">正在载入示例照片…</p>
          <div class="drop-message">松手以打开照片</div>
        </div>
        <div class="preview-footer"><span><span class="indicator"></span><span id="source">示例照片</span></span><span id="dimensions">—</span></div>
      </section>
      <aside class="settings" aria-label="照片设置">
        <details class="controls editing" open>
          <summary>裁切</summary>
          <div class="section-header edit-row">
            <label for="crop-ratio">裁切比例</label>
            <select id="crop-ratio">
              <option value="free">原图比例</option>
              <option value="1:1">1:1 方形</option>
              <option value="4:5">4:5 竖幅</option>
              <option value="3:4">3:4 竖幅</option>
              <option value="2:3">2:3 竖幅</option>
              <option value="3:2">3:2 横幅</option>
              <option value="4:3">4:3 横幅</option>
              <option value="16:9">16:9 宽幅</option>
            </select>
            <button id="crop-reset" class="button reset" type="button">重置</button>
          </div>
          <div class="ranges">
            <label for="crop-zoom">放大裁切 <output id="crop-zoom-value" for="crop-zoom">100%</output></label>
            <input id="crop-zoom" type="range" min="100" max="300" value="100">
            <label for="crop-x">水平位置 <output id="crop-x-value" for="crop-x">50%</output></label>
            <input id="crop-x" type="range" min="0" max="100" value="50">
            <label for="crop-y">垂直位置 <output id="crop-y-value" for="crop-y">50%</output></label>
            <input id="crop-y" type="range" min="0" max="100" value="50">
          </div>
          <p id="crop-hint" class="hint" aria-live="polite" aria-atomic="true"></p>
        </details>
        <details class="controls editing" open>
          <summary>调色</summary>
          <div class="section-header edit-row">
            <label for="grade">调色预设</label>
            <select id="grade">
              <option value="none">原色</option>
              <option value="chrome">低饱和纪实</option>
              <option value="vivid">鲜艳风光</option>
              <option value="portrait">柔和人像</option>
              <option value="amber">暖调复古</option>
              <option value="cinema">冷影暖光</option>
              <option value="mono">高反差黑白</option>
            </select>
            <button id="grade-reset" class="button reset" type="button">重置</button>
          </div>
          <p id="grade-hint" class="hint">选一个调色预设后，可调整预设强度。</p>
          <div class="ranges">
            <label for="grade-strength">预设强度 <output id="grade-strength-value" for="grade-strength">100%</output></label>
            <input id="grade-strength" type="range" min="0" max="100" value="100">
          </div>
          <details class="adjustments">
            <summary>手动微调</summary>
            <div class="ranges">
              <label for="exposure">曝光 <output id="exposure-value" for="exposure">0 EV</output></label>
              <input id="exposure" type="range" min="-1.5" max="1.5" value="0" step="0.1">
              <label for="contrast">对比度 <output id="contrast-value" for="contrast">0</output></label>
              <input id="contrast" type="range" min="-50" max="50" value="0">
              <label for="saturation">饱和度 <output id="saturation-value" for="saturation">0</output></label>
              <input id="saturation" type="range" min="-100" max="50" value="0">
              <label for="warmth">冷暖 <output id="warmth-value" for="warmth">0</output></label>
              <input id="warmth" type="range" min="-50" max="50" value="0">
            </div>
          </details>
        </details>
        <section class="controls">
          <div class="section-header"><h2><svg><use href="#icon-sliders"/></svg> 边框样式</h2><button id="reset" class="button reset" type="button" title="恢复边框默认值"><svg><use href="#icon-reset"/></svg> 重置</button></div>
          <fieldset class="presets">
            <legend class="sr-only">边框样式</legend>
            <label><input type="radio" name="preset" value="glass" checked><span><i class="swatch glass"></i>毛玻璃</span></label>
            <label><input type="radio" name="preset" value="paper"><span><i class="swatch paper"></i>白相纸</span></label>
            <label><input type="radio" name="preset" value="night"><span><i class="swatch night"></i>暗调</span></label>
          </fieldset>
          <div class="ranges">
            <label for="margin">边框宽度 <output id="margin-value" for="margin"></output></label>
            <input id="margin" type="range" min="2" max="18" value="8">
            <label for="blur">模糊强度 <output id="blur-value" for="blur"></output></label>
            <input id="blur" type="range" min="0" max="100" value="62">
            <label for="radius">照片圆角 <output id="radius-value" for="radius"></output></label>
            <input id="radius" type="range" min="0" max="8" value="2">
          </div>
        </section>
        <section class="controls watermark">
          <div class="section-header"><h2>相机水印</h2><label class="toggle"><input id="watermark" type="checkbox" checked aria-label="显示相机水印"><span></span></label></div>
          <p class="hint" id="metadata">示例水印可直接编辑。</p>
          <div id="watermark-fields" class="fields">
            <label>相机型号<input id="camera" type="text" maxlength="100" placeholder="例如 Fujifilm X100VI"></label>
            <label>镜头 <span class="optional">选填</span><input id="lens" type="text" maxlength="100" placeholder="例如 XF 23mm F2 R WR"></label>
            <label>拍摄参数<input id="parameters" type="text" maxlength="160" placeholder="例如 23 mm · ƒ/2 · 1/500 s · ISO 200"></label>
            <label>日期或签名 <span class="optional">选填</span><input id="caption" type="text" maxlength="80" placeholder="输入日期或摄影师署名"></label>
          </div>
        </section>
        <section class="exports" aria-label="导出设置">
          <div class="export-options">
            <label><span class="sr-only">图像格式</span><select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option></select></label>
            <label><span class="sr-only">导出尺寸</span><select id="size"><option value="original">原图尺寸</option><option value="2048">成图长边 ≤ 2048 px</option></select></label>
          </div>
          <button class="button primary download" id="download" type="button" disabled><svg><use href="#icon-download"/></svg> 下载成图</button>
        </section>
      </aside>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer class="site-footer"><a href="https://unsplash.com/photos/a-lake-surrounded-by-mountains-and-trees-NwJ-bJk4VRE" target="_blank" rel="noopener noreferrer">示例照片 · Finge Holden / Unsplash</a></footer>
</body>
</html>
